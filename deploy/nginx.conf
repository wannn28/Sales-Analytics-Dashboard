server {
    listen 80;
    server_name sales.iquee.tech;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name sales.iquee.tech;
    ssl_certificate /etc/letsencrypt/live/sales.iquee.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales.iquee.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/sales-dashboard;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location = /index.html { add_header Cache-Control no-cache; }
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
